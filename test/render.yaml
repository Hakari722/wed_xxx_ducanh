services:
  - type: web
    name: memoryhub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_HTTPS_ONLY
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "500"
